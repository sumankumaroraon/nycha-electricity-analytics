[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nycha-energy"
version = "1.0.0"
description = "Electricity consumption, cost drivers and forecasting for NYC Housing Authority facilities"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
nycha_energy = ["templates/*.html"]
